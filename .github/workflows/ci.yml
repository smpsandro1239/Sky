name: SKY CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sky
          POSTGRES_PASSWORD: sky
          POSTGRES_DB: sky
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sky -d sky"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Validate SQLite migrations
        run: DATABASE_URL=sqlite+pysqlite:///./migration-test.db alembic upgrade head
      - name: Validate PostgreSQL migrations
        env:
          DATABASE_URL: postgresql+psycopg://sky:sky@localhost:5432/sky
        run: alembic upgrade head
      - run: python -m pytest

  web-checks:
    name: Web lint and typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - name: Build Next.js application
        run: npm run build
